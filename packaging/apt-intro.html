<p><a href="https://github.com/tg123/sshpiper">sshpiper</a>, the SSH reverse
proxy that routes by user name, built unchanged from the current upstream
master. Install <code>sshpiper</code>: the daemon is
<code>/usr/sbin/sshpiperd</code> and the plugins are under
<code>/usr/lib/sshpiper/plugins/</code>. The package installs no service and no
configuration.</p>
