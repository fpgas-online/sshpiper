# What kind of packaging repository this is, and why it differs from the
# defaults: mithro/apt-repo-action's docs/packaging.md ("The declaration").
#
# A mirror: `packaging` (this branch, no history in common with sshpiper's)
# holds the build and the sync; master and every other branch and tag of
# github.com/tg123/sshpiper are exact copies of upstream's, and a moved
# master is built and published straight away (docs/packaging.md, "Mirrors").
kind = "mirror"
upstream = "https://github.com/tg123/sshpiper.git"
architectures = ["amd64", "arm64"]
suites = ["bookworm", "trixie", "forky", "sid"]

[mirror]
build = "master"
# Named although the sync never touches the default branch anyway: this
# repository is a GitHub fork, whose default branch was upstream's `master`
# when the packaging was added.
ours = ["packaging"]
# upstream's releases are v1.6.1, v1.6.0, ...
tags = "v[0-9]*"

[exceptions]
PKG-SUITES = "fpgas.online uses it"
PKG-ARCH = "upstream supports only amd64 and arm64: its .goreleaser.yaml builds linux for those two"
